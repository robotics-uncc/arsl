# ---------------------------------------------------------------------------
# Minimal Mistakes — https://mmistakes.github.io/minimal-mistakes/
#
# Skin: one-line swap. Options are
#   default, air, aqua, contrast, dark, dirt, mint, neon, plum, sunrise
# ---------------------------------------------------------------------------
theme                    : "minimal-mistakes-jekyll"
minimal_mistakes_skin    : "air"

title                    : "Autonomous Robots and Systems Laboratory"
title_separator          : "|"
subtitle                 : "UNC Charlotte"
masthead_title           : "ARSL"
name                     : "Autonomous Robots and Systems Laboratory"
description              : >-
  Research in aerospace and ocean vehicle guidance, dynamics, control, and path
  planning — trajectory optimization, informative path planning, and aerial and
  marine field robotics.
locale                   : "en-US"

# Project site: repo github.com/robotics-uncc/arsl serves under /arsl.
# The Pages workflow passes the same value via --baseurl at build time.
url                      : "https://robotics-uncc.github.io"
baseurl                  : "/arsl"
repository               : "robotics-uncc/arsl"
logo                     : "/assets/images/2023-04/ARSL_clearb.png"

# Fallback preview image for pages that set no header image of their own —
# without it only the homepage gets a card when a link is shared. The homepage
# still uses its own hero (header.overlay_image wins in _includes/seo.html);
# this is the same photograph, so the two agree.
og_image                 : "/assets/images/2025-05/dji_0038.jpg"
og_image_alt             : "An ARSL quadrotor in flight over the UNC Charlotte campus"

atom_feed:
  hide                   : true

search                   : false
words_per_minute         : 200

# ---------------------------------------------------------------------------
# Sidebar author card
# ---------------------------------------------------------------------------
# Retained for SEO/schema metadata only — author_profile is off site-wide, so
# none of this renders as a sidebar.
author:
  name        : "Artur Wolek"
  avatar      : "/assets/images/2023-04/Wolek_sq.png"
  bio         : "Assistant Professor, Mechanical Engineering and Engineering
                 Science, UNC Charlotte. Aerospace and ocean vehicle guidance,
                 dynamics, control and path planning."
  location    : "BATT CAVE Research Building, Room 103"
  email       : "awolek@charlotte.edu"
  links:
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?hl=en&user=D38WTZ8AAAAJ&view_op=list_works&sortby=pubdate"
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/playlist?list=PL2kZN0CkV04iDJmyfa4pZN371wuY8tPPI"
    # NOTE: minimal-mistakes emits author/footer link URLs verbatim, with no
    # relative_url filter, so only absolute URLs belong here. The CV is linked
    # from the homepage body instead, where the filter does apply.

footer:
  links:
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?hl=en&user=D38WTZ8AAAAJ&view_op=list_works&sortby=pubdate"
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/playlist?list=PL2kZN0CkV04iDJmyfa4pZN371wuY8tPPI"

# ---------------------------------------------------------------------------
include: ["_pages"]
exclude: ["README.md", "Gemfile", "Gemfile.lock", "vendor", "node_modules"]

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      read_time: false
      share: false
      related: false
      sidebar:
        nav: null
